<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b00020"><title>Emergency NFC</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--red:#b00020;--green:#146c43;--bg:#f4f6f8;--card:#fff;--text:#16181b;--muted:#666;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:640px;margin:auto;padding:0 16px 32px}.hero{background:linear-gradient(135deg,#b00020,#850018);color:#fff;margin:0 -16px 16px;padding:calc(24px + env(safe-area-inset-top)) 20px 24px;text-align:center}.hero h1{margin:0;font-size:28px}.hero p{margin:8px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(0,0,0,.08)}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;border:0;border-radius:14px;padding:14px 16px;margin:10px 0;font-size:17px;font-weight:800;text-decoration:none;color:#fff}.green{background:var(--green)}.red{background:var(--red)}.muted{color:var(--muted)}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee;color:#333;font-weight:700}.row{padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.label{font-size:13px;color:var(--muted);font-weight:700}.value{font-size:18px;font-weight:750;margin-top:2px}@media(prefers-color-scheme:dark){:root{--bg:#111315;--card:#1c1f22;--text:#f3f4f5;--muted:#b3b7bc;--line:#363a3f}.pill{background:#2c3035;color:#fff}}</style></head><body><main><section class="hero"><h1>EMERGENCY INFORMATION</h1><p>Nate's Krafts Emergency NFC</p></section><div id="app"><section class="card"><h2>Loading tag...</h2></section></div></main><script>const SUPABASE='https://wjjozcgjkvkespwefwad.supabase.co';const KEY='sb_publishable_N0TwYqPTjelB60zTPS4cNQ_VXUY68oz';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const code=(new URLSearchParams(location.search).get('tag')||'').toUpperCase();const app=document.getElementById('app');async function run(){if(!/^[A-F0-9]{12}$/.test(code)){app.innerHTML='<section class="card"><h2>Invalid NFC tag</h2><p class="muted">This tag address is not recognised.</p></section>';return}try{const r=await fetch(SUPABASE+'/rest/v1/rpc/public_emergency_profile',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})});if(!r.ok)throw new Error(await r.text());const rows=await r.json();if(!rows.length){app.innerHTML='<section class="card"><h2>Tag not found</h2><p class="muted">This NFC tag is not registered.</p></section>';return}const p=rows[0];if(p.tag_status==='unactivated'){app.innerHTML='<section class="card"><span class="pill">Tag '+esc(code)+'</span><h2>Your tag is ready</h2><p>This NFC emergency tag has not been activated yet.</p><p class="muted">First tap detected successfully.</p></section><section class="card"><h3>NFC test passed</h3><p>This is the permanent URL for this tag.</p></section>';return}if(p.tag_status==='disabled'){app.innerHTML='<section class="card"><h2>Tag disabled</h2><p class="muted">This NFC emergency tag is currently disabled.</p></section>';return}const info=[['Medical conditions',p.medical_conditions],['Allergies',p.allergies],['Medication information',p.medications],['Critical notes',p.important_medical_notes]].filter(x=>x[1]);app.innerHTML='<section class="card"><h2>'+esc(p.full_name)+'</h2><p>If I am unable to communicate, please use the information below.</p></section><section class="card">'+(info.map(x=>'<div class="row"><div class="label">'+esc(x[0])+'</div><div class="value">'+esc(x[1])+'</div></div>').join('')||'<p class="muted">No critical medical alerts listed.</p>')+'</section>'+(p.primary_contact_phone?'<a class="btn green" href="tel:'+esc(p.primary_contact_phone)+'">CALL PRIMARY EMERGENCY CONTACT</a>':'')+(p.secondary_contact_phone?'<a class="btn green" href="tel:'+esc(p.secondary_contact_phone)+'">CALL SECOND EMERGENCY CONTACT</a>':'')+'<a class="btn red" href="tel:999">CALL 999</a><a class="btn red" href="tel:112">CALL 112</a>'}catch(e){app.innerHTML='<section class="card"><h2>Unable to load tag</h2><p class="muted">Please try again.</p></section>'}}run();</script></body></html>
