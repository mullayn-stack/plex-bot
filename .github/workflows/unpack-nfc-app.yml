name: Install NFC Emergency App

on:
  push:
    branches: [main]
    paths:
      - 'project.tar.gz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy files with application source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name project.tar.gz.b64 -exec rm -rf {} +
          base64 --decode project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          rm -f project.tar.gz project.tar.gz.b64
      - name: Commit application source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Nate’s Krafts Emergency NFC app' || exit 0
          git push
